services:
  postgres-prod:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: ${DB_USER_ADMIN}
      POSTGRES_PASSWORD: ${DB_PASSWORD_ADMIN}
      POSTGRES_DB: ${DB_DATABASE}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
    volumes:
      - postgres_volume:/var/lib/postgresql/data
      - ./dockerConfig/init.sh:/docker-entrypoint-initdb.d/init.sh
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orarimed-network

  redis-prod:
    image: redis:7-alpine
    container_name: redis-prod
    restart: always
    ports:
      - '6380:6379'
    volumes:
      - redis_volume:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - orarimed-network

  adonis_app-prod:
    restart: always
    depends_on:
      postgres-prod:
        condition: service_healthy
      redis-prod:
        condition: service_healthy
    build:
      context: .
      target: production
    ports:
      - '3334:3333'
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 3333
      DB_HOST: postgres-prod
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      REDIS_HOST: redis-prod
      REDIS_PORT: 6379
    volumes:
      - adonis_app_data:/home/node/app/build/uploads
    networks:
      - orarimed-network

  worker-prod:
    depends_on:
      postgres-prod:
        condition: service_healthy
      redis-prod:
        condition: service_healthy
    build:
      context: .
      target: production
    env_file:
      - .env
    environment:
      DB_HOST: postgres-prod
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}
      REDIS_HOST: redis-prod
      REDIS_PORT: 6379
    volumes:
      - ./:/home/node/app
      - /home/node/app/node_modules
    command: node ace jobs:listen
    networks:
      - orarimed-network

networks:
  orarimed-network:
    driver: bridge

volumes:
  postgres_volume:
  redis_volume:
  adonis_app_data:
